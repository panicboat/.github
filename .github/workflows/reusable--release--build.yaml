# Builds the container image of a published service release or a dispatched tag and tags it with the release version and the release tag.
name: 'Reusable - Release - Build'

on:
  workflow_call:
    inputs:
      app-id:
        required: true
        type: string
        description: 'GitHub App ID for authentication'
    secrets:
      private-key:
        required: true
        description: 'GitHub App private key for authentication'

jobs:
  detect-component:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.parse.outputs.service }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      working-directory: ${{ steps.resolve-dir.outputs.working-directory }}
    steps:
      - name: Checkout shared workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false

      - name: Parse tag
        id: parse
        env:
          # `inputs` in a reusable workflow holds only its own workflow_call inputs, so the caller's dispatch input `tag` is read from the event.
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          service=$(bash .shared-workflows/scripts/terragrunt-release/release-service.sh --tag "$TAG")
          {
            echo "service=$service"
            echo "version=${TAG#"$service"-}"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
      # Container targets carry no environment, so environments is not passed.
      - name: Resolve container target
        id: resolver
        uses: panicboat/deploy-actions/label-resolver@9c5aea836b982c12d283c4bea8fac965d7242eda # v0.1.0
        with:
          repository: ${{ github.repository }}
          service: ${{ steps.parse.outputs.service }}
          ref: ${{ steps.parse.outputs.tag }}
      - name: Resolve working directory
        id: resolve-dir
        env:
          SERVICE: ${{ steps.parse.outputs.service }}
          TARGETS: ${{ steps.resolver.outputs.targets }}
        run: |
          set -euo pipefail
          dir=$(jq -r 'first(.[] | select(.type == "container")) | .working_directory' <<<"$TARGETS")
          if [ -z "$dir" ]; then
            echo "::error::No directory found for service '$SERVICE' among the container targets of workflow-config.yaml"
            exit 1
          fi
          echo "working-directory=$dir" >> "$GITHUB_OUTPUT"

  container-build:
    needs: detect-component
    concurrency:
      group: image-build-${{ needs.detect-component.outputs.service }}-${{ github.sha }}
      cancel-in-progress: false
    uses: $/.github/workflows/internal--image-builder.yaml
    with:
      image-name: ${{ needs.detect-component.outputs.service }}
      working-directory: ${{ needs.detect-component.outputs.working-directory }}
      # The ref of a dispatched run is not the source of the release.
      ref: ${{ needs.detect-component.outputs.tag }}
      app-id: ${{ inputs.app-id }}
      semver-tag: ${{ needs.detect-component.outputs.version }}
      release-tag: ${{ needs.detect-component.outputs.tag }}
    secrets:
      private-key: ${{ secrets.private-key }}
