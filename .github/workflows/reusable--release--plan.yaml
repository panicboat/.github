# Plans a service's production environment and diffs its production kustomizations against the previous release on its release-please pull request.
name: 'Reusable - Release - Plan'

on:
  workflow_call:
    inputs:
      app-id:
        required: true
        type: string
        description: 'GitHub App ID for authentication'
    secrets:
      private-key:
        required: true
        description: 'GitHub App private key for authentication'

jobs:
  resolve:
    name: 'Resolve Release Targets'
    if: startsWith(github.head_ref, 'release-please--branches--main--components--')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
      kustomizations: ${{ steps.resolve.outputs.kustomizations }}
      previous-tag: ${{ steps.resolve.outputs.previous-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout shared workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false

      - name: Parse release service
        id: service
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          service=$(bash .shared-workflows/scripts/terragrunt-release/release-service.sh --branch "$HEAD_REF")
          echo "service=$service" >> "$GITHUB_OUTPUT"

      - name: Resolve service targets
        id: resolver
        uses: panicboat/deploy-actions/label-resolver@9c5aea836b982c12d283c4bea8fac965d7242eda # v3.1.0
        with:
          repository: ${{ github.repository }}
          service: ${{ steps.service.outputs.service }}
          environments: production

      - name: Resolve release targets
        id: resolve
        env:
          SERVICE: ${{ steps.service.outputs.service }}
          TARGETS: ${{ steps.resolver.outputs.targets }}
        run: |
          set -euo pipefail
          targets=$(bash .shared-workflows/scripts/terragrunt-release/release-targets.sh <<<"$TARGETS")
          kustomizations=$(bash .shared-workflows/scripts/kustomize-release/release-kustomizations.sh <<<"$TARGETS")
          previous_tag=$(bash .shared-workflows/scripts/kustomize-release/previous-release-tag.sh "$SERVICE")
          {
            echo "targets=$targets"
            echo "kustomizations=$kustomizations"
            echo "previous-tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

  plan:
    name: 'Plan Release (${{ matrix.target.service }}:${{ matrix.target.environment }})'
    needs: resolve
    if: needs.resolve.outputs.targets != '[]'
    strategy:
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets) }}
      fail-fast: false
    uses: $/.github/workflows/reusable--terragrunt-runner.yaml
    with:
      service-name: ${{ matrix.target.service }}
      environment: ${{ matrix.target.environment }}
      action-type: plan
      iam-role: ${{ matrix.target.iam_role_plan }}
      aws-region: ${{ matrix.target.aws_region }}
      working-directory: ${{ matrix.target.working_directory }}
      app-id: ${{ inputs.app-id }}
    secrets:
      private-key: ${{ secrets.private-key }}

  kustomize-diff:
    name: 'Kustomize Diff (${{ matrix.kustomization.service }}:${{ matrix.kustomization.environment }})'
    needs: resolve
    if: needs.resolve.outputs.kustomizations != '[]' && needs.resolve.outputs.previous-tag != ''
    strategy:
      matrix:
        kustomization: ${{ fromJson(needs.resolve.outputs.kustomizations) }}
      fail-fast: false
    uses: $/.github/workflows/internal--kustomize-builder.yaml
    with:
      service-name: ${{ matrix.kustomization.service }}
      environment: ${{ matrix.kustomization.environment }}
      kustomization-directory: ${{ matrix.kustomization.kustomization_directory }}
      base-ref: ${{ needs.resolve.outputs.previous-tag }}
      app-id: ${{ inputs.app-id }}
    secrets:
      private-key: ${{ secrets.private-key }}
