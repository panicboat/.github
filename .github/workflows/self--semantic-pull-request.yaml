# Validates that the pull request title follows Conventional Commits.
name: 'Self - Semantic Pull Request'

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  semantic:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable--semantic-pull-request.yaml
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}
