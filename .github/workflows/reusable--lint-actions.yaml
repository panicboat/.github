# Checks that every action is pinned to a full commit SHA.
name: 'Reusable - Lint GitHub Actions'

on:
  workflow_call:

jobs:
  ensure-sha-pinned:
    name: Ensure actions are pinned to SHAs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: zgosalvez/github-actions-ensure-sha-pinned-actions@76ed8a4c86957c2d27d44bab47f172193149d926 # v5.0.11
