# Reviews Renovate major-update pull requests with Gemini on Vertex AI and posts the review.
name: 'Reusable - Renovate Major Review'

on:
  workflow_call:
    inputs:
      prompt-path:
        required: true
        type: string
        description: 'Path of the prompt file in the calling repository (e.g. .github/prompts/renovate-major-review.md)'

jobs:
  render:
    name: 'Render'
    if: github.event.label.name == '📈 major-update' && github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # helmfile templates can exec commands, so PR content is rendered in a job without id-token or the review environment.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout shared workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false

      - name: Setup aqua
        uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.65.2

      - name: Render manifest diff
        # HEAD is the PR merge commit, so its first parent is the base it merges into.
        run: bash .shared-workflows/scripts/kubernetes-hydrate/render-diff.sh HEAD^1 "${RUNNER_TEMP}/render-diff"

      - name: Upload manifest diff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-diff
          path: ${{ runner.temp }}/render-diff
          retention-days: 1

  review:
    name: 'Review'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Environment-scoped OIDC sub keeps a prompt-injected run from assuming the plan roles, which trust the pull_request sub.
    environment: renovate-major-review
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      body: ${{ steps.parse.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download manifest diff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: render-diff
          path: .render-diff

      - name: Setup aqua
        uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.65.2

      - name: Fetch pull request
        id: fetch-pull-request
        # Gemini CLI redacts GitHub tokens from its shell tool, so the pull request is handed over as files instead of gh calls.
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .review-context
          gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json title,body,files,headRefName > .review-context/pull-request.json
          gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" > .review-context/diff.patch

      - name: Review with Gemini
        id: gemini
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          # Only renovate[bot] branches of this repository reach this job; upstream text in the pull request is left to the prompt as data.
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          # The sandbox image has no helm, and tools.core leaves only the helm subcommands to the shell.
          GEMINI_SANDBOX: 'false'
          # The action copies .gemini/telemetry.log into gemini-artifacts/, which keeps each tool call and its arguments for review.
          GEMINI_TELEMETRY_ENABLED: 'true'
          GEMINI_TELEMETRY_TARGET: 'local'
          GEMINI_TELEMETRY_OUTFILE: '.gemini/telemetry.log'
          GEMINI_TELEMETRY_LOG_PROMPTS: 'true'
        with:
          gcp_workload_identity_provider: 'projects/237641919067/locations/global/workloadIdentityPools/github-actions/providers/github'
          gcp_project_id: 'panicboat-platform-github'
          gcp_location: 'global'
          gcp_token_format: ''
          use_vertex_ai: 'true'
          gemini_cli_version: '0.63.0'
          gemini_model: 'gemini-3.8-flash'
          prompt: |
            Read `${{ inputs.prompt-path }}` and follow it.
            Pull request number: ${{ github.event.pull_request.number }}
          settings: |
            {
              "context": {
                "fileFiltering": {
                  "respectGitIgnore": false
                }
              },
              "tools": {
                "core": [
                  "read_file",
                  "glob",
                  "grep_search",
                  "web_fetch",
                  "run_shell_command(helm repo add)",
                  "run_shell_command(helm repo update)",
                  "run_shell_command(helm pull)",
                  "run_shell_command(helm show)"
                ]
              }
            }

      - name: Checkout shared workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false

      - name: Parse review
        id: parse
        env:
          RESPONSE: ${{ steps.gemini.outputs.summary }}
        run: |
          if review="$(printf '%s' "$RESPONSE" | bash .shared-workflows/scripts/gemini-output/parse.sh review)"; then
            delimiter="EOF_$(openssl rand -hex 16)"
            {
              echo "body<<${delimiter}"
              jq -r '.body' <<<"$review"
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Report token usage
        if: ${{ !cancelled() }}
        run: |
          if [ -s gemini-artifacts/stdout.log ] && jq -e '.stats' gemini-artifacts/stdout.log >/dev/null 2>&1; then
            {
              echo '### Gemini token usage'
              echo '```json'
              jq '.stats.models' gemini-artifacts/stdout.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload execution log
        if: ${{ !cancelled() && hashFiles('gemini-artifacts/**') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-major-review-execution
          path: gemini-artifacts/
          retention-days: 7

  post:
    name: 'Post Review'
    needs: review
    if: needs.review.result == 'success' && needs.review.outputs.body != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Upsert review comment
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: ${{ needs.review.outputs.body }}
          comment-tag: renovate-major-review
          mode: upsert
          pr-number: ${{ github.event.pull_request.number }}
