# Reviews Renovate major-update pull requests with Claude and posts the review.
name: 'Reusable - Renovate Major Review'

on:
  workflow_call:
    inputs:
      prompt-path:
        required: true
        type: string
        description: 'Path of the prompt file in the calling repository (e.g. .github/prompts/renovate-major-review.md)'

jobs:
  render:
    name: 'Render'
    if: github.event.label.name == '📈 major-update' && github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # helmfile templates can exec commands, so PR content is rendered in a job without id-token or the review environment.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout shared workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false

      - name: Setup aqua
        uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.65.2

      - name: Render manifest diff
        # HEAD is the PR merge commit, so its first parent is the base it merges into.
        run: bash .shared-workflows/scripts/kubernetes-hydrate/render-diff.sh HEAD^1 "${RUNNER_TEMP}/render-diff"

      - name: Upload manifest diff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-diff
          path: ${{ runner.temp }}/render-diff
          retention-days: 1

  review:
    name: 'Review'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Environment-scoped OIDC sub keeps a prompt-injected run from assuming the plan roles, which trust the pull_request sub.
    environment: renovate-major-review
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      body: ${{ steps.check.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download manifest diff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: render-diff
          path: .render-diff

      - name: Setup aqua
        uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.65.2

      - name: Fetch pull request
        id: fetch-pull-request
        # The model gets no git or gh, since git diff and gh can read files outside the working directory.
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .review-context
          gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json title,body,files,headRefName > .review-context/pull-request.json
          gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" > .review-context/diff.patch

      - name: Install bubblewrap
        id: install-bubblewrap
        # The secret scrub needs bubblewrap, which the action installs only when allowed_non_write_users is set.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Review with Claude
        id: claude
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        env:
          # The action puts the GitHub token in the env, which Bash could read and WebFetch could send out.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          anthropic_federation_rule_id: 'fdrl_01EFTG7Y8vWedXu5dyKHk9VP'
          anthropic_organization_id: '3e6cc666-1654-4da0-9d46-3abb52bc7288'
          anthropic_service_account_id: 'svac_01XpqeHTNpHPf7zZSQXgck3S'
          anthropic_workspace_id: 'wrkspc_01Pn5wRk8fQ8vXGsUGzH66wv'
          # Read-only token; without it the action exchanges OIDC for the Claude App's write token.
          github_token: ${{ github.token }}
          # Renovate adds the review label itself, and the action rejects bot actors not listed here.
          allowed_bots: renovate
          prompt: |
            Read `${{ inputs.prompt-path }}` and follow it.
            Pull request number: ${{ github.event.pull_request.number }}
          # _temp holds the OIDC and Anthropic tokens and .git/config holds the GitHub token, so neither is readable.
          claude_args: |
            --model claude-sonnet-5-5
            --tools "Read,Glob,Grep,Bash,WebFetch"
            --max-budget-usd 5
            --settings '{"permissions":{"blockReadsOutsideWorkingDirectories":true}}'
            --json-schema '{"type":"object","properties":{"body":{"type":"string","minLength":1,"maxLength":60000}},"required":["body"]}'
            --allowedTools "WebFetch,Bash(helm repo add:*),Bash(helm repo update:*),Bash(helm pull:*),Bash(helm show:*)"
            --disallowedTools "Write,Edit,NotebookEdit,Agent,WebSearch,Read(//home/runner/work/_temp/**),Read(./.git/**)"

      - name: Checkout shared workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false

      - name: Check review
        id: check
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          GITHUB_TOKEN_VALUE: ${{ github.token }}
        run: |
          if review="$(bash .shared-workflows/scripts/review-output/check.sh review)"; then
            delimiter="EOF_$(openssl rand -hex 16)"
            {
              echo "body<<${delimiter}"
              jq -r '.body' <<<"$review"
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Report cost
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if result="$(jq -ce '[.[] | select(.type == "result")] | last | {total_cost_usd, num_turns}' "$EXECUTION_FILE" 2>/dev/null)"; then
            {
              echo '### Claude cost'
              echo '```json'
              echo "$result"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload execution log
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-major-review-execution
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7

  post:
    name: 'Post Review'
    needs: review
    if: needs.review.result == 'success' && needs.review.outputs.body != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Upsert review comment
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: ${{ needs.review.outputs.body }}
          comment-tag: renovate-major-review
          mode: upsert
          pr-number: ${{ github.event.pull_request.number }}
