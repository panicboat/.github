# Reviews Renovate major-update pull requests with Claude and posts the review.
name: 'Reusable - Renovate Major Review'

on:
  workflow_call:
    inputs:
      prompt-path:
        required: true
        type: string
        description: 'Path of the prompt file in the calling repository (e.g. .github/prompts/renovate-major-review.md)'

jobs:
  render:
    name: 'Render'
    if: github.event.label.name == '📈 major-update' && github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # helmfile templates can exec commands, so PR content is rendered in a job without id-token or the review environment.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout shared workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false

      - name: Setup aqua
        uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.65.2

      - name: Render manifest diff
        # HEAD is the PR merge commit, so its first parent is the base it merges into.
        run: bash .shared-workflows/scripts/kubernetes-hydrate/render-diff.sh HEAD^1 "${RUNNER_TEMP}/render-diff"

      - name: Upload manifest diff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-diff
          path: ${{ runner.temp }}/render-diff
          retention-days: 1

  review:
    name: 'Review'
    needs: render
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: $/.github/workflows/internal--claude-code-action.yaml
    with:
      prompt-path: ${{ inputs.prompt-path }}
      output-kind: review
      model: claude-sonnet-5-5
      bedrock-model: global.anthropic.claude-sonnet-4-6
      tools: Read,Glob,Grep,Bash,WebFetch
      allowed-tools: WebFetch,Bash(helm repo add:*),Bash(helm repo update:*),Bash(helm pull:*),Bash(helm show:*)
      max-budget-usd: '5'
      allowed-bots: renovate
      download-artifact-name: render-diff
      download-artifact-path: .render-diff
      setup-aqua: true
      execution-log-name: renovate-major-review-execution

  post:
    name: 'Post Review'
    needs: review
    if: needs.review.result == 'success' && needs.review.outputs.body != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Upsert review comment
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: ${{ needs.review.outputs.body }}
          comment-tag: renovate-major-review
          mode: upsert
          pr-number: ${{ github.event.pull_request.number }}
