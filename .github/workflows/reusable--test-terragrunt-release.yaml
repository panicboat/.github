# Validates the release-please configs of the caller's production environments.
name: 'Reusable - Test Terragrunt Release'

on:
  workflow_call:

jobs:
  validate:
    name: 'Validate terragrunt release config'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout shared workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false

      - name: Resolve release candidates
        id: resolver
        uses: panicboat/deploy-actions/label-resolver@9c5aea836b982c12d283c4bea8fac965d7242eda # v0.1.0
        with:
          repository: ${{ github.repository }}
          service: all

      - name: Check release-please configs
        env:
          CANDIDATES: ${{ steps.resolver.outputs.candidates }}
        run: |
          set -euo pipefail
          printf '%s\n' "${CANDIDATES}" > "${RUNNER_TEMP}/candidates.json"
          bash .shared-workflows/scripts/terragrunt-release/check-release-configs.sh "${RUNNER_TEMP}/candidates.json"
