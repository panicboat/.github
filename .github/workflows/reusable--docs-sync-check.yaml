# Judges with Gemini on Vertex AI whether a pull request keeps the docs in sync and reports the verdict as the Docs Sync Check commit status.
name: 'Reusable - Docs Sync Check'

on:
  workflow_call:
    inputs:
      scope-pattern:
        required: true
        type: string
        description: 'Extended regex matching the changed paths whose docs are checked (e.g. ^dystopia/)'
      prompt-path:
        required: true
        type: string
        description: 'Path of the prompt file in the calling repository (e.g. .github/prompts/docs-sync-check.md)'

jobs:
  scope:
    name: 'Scope'
    # Fork pull requests only get a read-only token, so the status could not be written.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout shared workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false

      - name: Test decide script
        run: bash .shared-workflows/scripts/docs-sync-check/decide.test.sh

      - name: Decide
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCOPE_PATTERN: ${{ inputs.scope-pattern }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'docs-check-approved') }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          BODY_OR_BASE_CHANGED: ${{ (github.event.changes.body || github.event.changes.base) && 'true' || 'false' }}
        run: |
          approved="$APPROVED"
          prior_state=""
          if [ "$EVENT_ACTION" = "labeled" ] && [ "$EVENT_LABEL" = "docs-check-approved" ]; then
            # The payload labels are stale when this run starts after another run already removed the label.
            approved="$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/labels?per_page=100" --jq 'any(.[]; .name == "docs-check-approved")')"
            prior_state="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/status?per_page=100" --jq '[.statuses[] | select(.context == "Docs Sync Check") | .state][0] // ""')"
          fi
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' | APPROVED="$approved" PRIOR_STATE="$prior_state" bash .shared-workflows/scripts/docs-sync-check/decide.sh >> "$GITHUB_OUTPUT"

      - name: Remove approval label
        if: steps.decide.outputs.remove_label == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! output="$(gh api -X DELETE "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels/docs-check-approved" 2>&1)"; then
            # SILENT: a 404 means someone already removed the label, which is the state this step wants.
            if grep -q 'HTTP 404' <<<"$output"; then exit 0; fi
            echo "$output" >&2
            exit 1
          fi

      - name: Write status
        if: steps.decide.outputs.mode != 'ignore'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.decide.outputs.mode }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$MODE" in
            skip-bot)       state=success; description='bot の PR は判定しません' ;;
            skip-unchanged) state=success; description='対象のパスに変更がありません' ;;
            approved)       state=success; description='docs-check-approved ラベルで承認されています' ;;
            judge)          state=pending; description='AI が判定しています' ;;
            *) echo "unknown mode: $MODE" >&2; exit 1 ;;
          esac
          gh api "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context='Docs Sync Check' \
            -f description="$description" \
            -f target_url="$RUN_URL"

      - name: Write failure status
        if: ${{ failure() && steps.decide.outputs.mode != 'ignore' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=failure \
            -f context='Docs Sync Check' \
            -f description='判定できませんでした。再実行するか、確かめて docs-check-approved を付けてください' \
            -f target_url="$RUN_URL"

  judge:
    name: 'Judge'
    needs: scope
    if: needs.scope.outputs.mode == 'judge'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Environment-scoped OIDC sub keeps a prompt-injected run from assuming the plan roles, which trust the pull_request sub.
    environment: docs-sync-check
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      passed: ${{ steps.parse.outputs.passed }}
      body: ${{ steps.parse.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request
        id: fetch-pull-request
        # Gemini CLI redacts GitHub tokens from its shell tool, so the pull request is handed over as files instead of gh calls.
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .review-context
          gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json title,body,files > .review-context/pull-request.json
          gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" > .review-context/diff.patch

      - name: Judge with Gemini
        id: gemini
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          # Only repository collaborators reach this job, since fork pull requests are skipped in scope.
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          # No shell tool is allowed, so the sandbox would only add a container start to every run.
          GEMINI_SANDBOX: 'false'
          # The action copies .gemini/telemetry.log into gemini-artifacts/, which keeps each tool call and its arguments for review.
          GEMINI_TELEMETRY_ENABLED: 'true'
          GEMINI_TELEMETRY_TARGET: 'local'
          GEMINI_TELEMETRY_OUTFILE: '.gemini/telemetry.log'
          GEMINI_TELEMETRY_LOG_PROMPTS: 'true'
        with:
          gcp_workload_identity_provider: 'projects/237641919067/locations/global/workloadIdentityPools/github-actions/providers/github'
          gcp_project_id: 'panicboat-platform-github'
          gcp_location: 'global'
          gcp_token_format: ''
          use_vertex_ai: 'true'
          gemini_cli_version: '0.63.0'
          gemini_model: 'gemini-3.5-flash-lite'
          prompt: |
            Read `${{ inputs.prompt-path }}` and follow it.
            Pull request number: ${{ github.event.pull_request.number }}
          settings: |
            {
              "tools": {
                "core": [
                  "read_file",
                  "glob",
                  "grep_search"
                ]
              }
            }

      - name: Checkout shared workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false

      - name: Parse verdict
        id: parse
        env:
          RESPONSE: ${{ steps.gemini.outputs.summary }}
        run: |
          if verdict="$(printf '%s' "$RESPONSE" | bash .shared-workflows/scripts/gemini-output/parse.sh docs-sync)"; then
            delimiter="EOF_$(openssl rand -hex 16)"
            echo "passed=$(jq -r '.passed' <<<"$verdict")" >> "$GITHUB_OUTPUT"
            {
              echo "body<<${delimiter}"
              jq -r '.body' <<<"$verdict"
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Report token usage
        if: ${{ !cancelled() }}
        run: |
          if [ -s gemini-artifacts/stdout.log ] && jq -e '.stats' gemini-artifacts/stdout.log >/dev/null 2>&1; then
            {
              echo '### Gemini token usage'
              echo '```json'
              jq '.stats.models' gemini-artifacts/stdout.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload execution log
        if: ${{ !cancelled() && hashFiles('gemini-artifacts/**') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-sync-check-execution
          path: gemini-artifacts/
          retention-days: 7

  report:
    name: 'Report'
    needs: [scope, judge]
    # Runs after a failed judge too so Scope's pending status gets a verdict; a cancelled run writes nothing and leaves it pending.
    if: ${{ !cancelled() && needs.scope.outputs.mode == 'judge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - name: Upsert judge comment
        if: needs.judge.outputs.body != ''
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: ${{ needs.judge.outputs.body }}
          comment-tag: docs-sync-check
          mode: upsert
          pr-number: ${{ github.event.pull_request.number }}

      - name: Write status
        env:
          GH_TOKEN: ${{ github.token }}
          JUDGE_RESULT: ${{ needs.judge.result }}
          PASSED: ${{ needs.judge.outputs.passed }}
          HAS_BODY: ${{ needs.judge.outputs.body != '' }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JUDGE_RESULT" != "success" ] || [ "$HAS_BODY" != "true" ]; then
            state=failure
            description='判定できませんでした。再実行するか、確かめて docs-check-approved を付けてください'
          elif [ "$PASSED" = "true" ]; then
            state=success
            description='文書と食い違いはありません'
          else
            state=failure
            description='文書との食い違いがあります。PR のコメントを見てください'
          fi
          gh api "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context='Docs Sync Check' \
            -f description="$description" \
            -f target_url="$RUN_URL"
