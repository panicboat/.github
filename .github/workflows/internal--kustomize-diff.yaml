# Posts the kustomize diff of one kustomization directory as a pull request comment.
name: 'Internal - Kustomize Diff'

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: 'Service name for identification'
      environment:
        required: true
        type: string
        description: 'Environment name (develop, staging, production, etc.)'
      kustomization-directory:
        required: true
        type: string
        description: 'Directory containing the kustomization.yaml to diff (skips the job when empty)'
      ref:
        required: false
        type: string
        default: ''
        description: 'Git ref to check out for the head manifests (empty uses the default ref of the triggering event)'
      app-id:
        required: true
        type: string
        description: 'GitHub App ID for authentication'
    secrets:
      private-key:
        required: true
        description: 'GitHub App private key for authentication'

jobs:
  kustomize-diff:
    name: 'Kustomize Diff'
    if: inputs.kustomization-directory != ''
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.private-key }}
          owner: ${{ github.repository_owner }}

      - name: Get PR information
        id: pr-info
        uses: jwalton/gh-find-current-pr@f3d61b485d2801773f7a07b2aaa3306bd8f8e653 # v1.3.5
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          state: all
        continue-on-error: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.ref }}

      - name: Checkout base ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          token: ${{ steps.app-token.outputs.token }}

      - name: Build head manifests
        id: kustomize-head
        uses: int128/kustomize-action@19a766fc2f43be39d1436d59555033be8aca07db # v1.196.0
        with:
          kustomization: ${{ inputs.kustomization-directory }}/kustomization.yaml
          write-individual-files: true

      - name: Build base manifests
        id: kustomize-base
        uses: int128/kustomize-action@19a766fc2f43be39d1436d59555033be8aca07db # v1.196.0
        with:
          base-directory: base
          kustomization: ${{ inputs.kustomization-directory }}/kustomization.yaml
          write-individual-files: true

      - name: Diff manifests
        id: diff
        uses: int128/diff-action@274034d712aef611adcbd41e5a647f43e4edd5a5 # v2.41.0
        with:
          base: ${{ steps.kustomize-base.outputs.directory }}
          head: ${{ steps.kustomize-head.outputs.directory }}

      - name: Comment PR
        if: steps.pr-info.outputs.number != ''
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            ## Kustomize Diff

            **Service**: `${{ inputs.service-name }}`
            **Environment**: `${{ inputs.environment }}`

            ${{ steps.diff.outputs.comment-body || 'No changes' }}
          comment-tag: "kubernetes-${{ inputs.service-name }}-${{ inputs.environment }}"
          mode: upsert
          pr-number: ${{ steps.pr-info.outputs.number }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          reactions: ${{ steps.diff.outputs.has-diff == 'true' && 'rocket' || '' }}
        continue-on-error: true
