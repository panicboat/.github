# Waits for every other workflow on a pull request so that one required check gates the merge.
name: 'Reusable - CI Gatekeeper'

on:
  workflow_call:
    inputs:
      exclude-workflow-names:
        required: false
        type: string
        default: ''
        description: 'Workflow names the gatekeeper does not wait for, one per line'

jobs:
  ci-gatekeeper:
    name: CI Gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for other workflows
        uses: int128/wait-for-workflows-action@ae18a458a41aec584ea98530f9d6962f4836edfb # v1.112.0
        with:
          max-timeout-seconds: 1800
          exclude-workflow-names: ${{ inputs.exclude-workflow-names }}
